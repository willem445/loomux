<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" role="img" aria-labelledby="wdTitle wdDesc">
<title id="wdTitle">How work moves through Orrerix</title>
<desc id="wdDesc">A human sets the vision. The orchestrator grooms it into issues and board tasks. A planner plans where warranted. Workers build in parallel, each in its own isolated git worktree. An adversarial reviewer and CI gate the result, sending changes back to the worker that wrote them. A verdict-gated, human-approved merge lands the work on main.</desc>
<defs>
  <linearGradient id="wdPanel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0E0F12"/><stop offset="1" stop-color="#08090B"/>
  </linearGradient>
  <radialGradient id="wdHubGlow"><stop offset="0" stop-color="#F8B400" stop-opacity=".38"/><stop offset="1" stop-color="#F8B400" stop-opacity="0"/></radialGradient>
  <radialGradient id="wdMainGlow"><stop offset="0" stop-color="#F8B400" stop-opacity=".45"/><stop offset="1" stop-color="#F8B400" stop-opacity="0"/></radialGradient>
  <marker id="wdAg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#C79A28"/></marker>
  <marker id="wdAd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6E6A62"/></marker>
</defs>

<rect x=".75" y=".75" width="978.5" height="448.5" rx="16" fill="url(#wdPanel)" stroke="#F8B400" stroke-opacity=".16"/>

<!-- orrery plate: faint tracks centred on the orchestrator -->
<g fill="none" stroke="#F8B400" stroke-opacity=".055" transform="rotate(-8 258 268)">
  <ellipse cx="258" cy="268" rx="212" ry="86"/>
  <ellipse cx="258" cy="268" rx="362" ry="146"/>
  <ellipse cx="258" cy="268" rx="516" ry="208"/>
  <ellipse cx="258" cy="268" rx="672" ry="268"/>
</g>

<text x="36" y="52" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#EDEAE0">How work moves through Orrerix</text>
<text x="36" y="73" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#807B72">One human intent &#183; many agents, each on its own track &#183; one gated merge</text>

<g transform="translate(920 54)" fill="none" stroke="#F8B400" stroke-opacity=".55">
  <ellipse rx="19" ry="7.5" transform="rotate(-20)"/><ellipse rx="19" ry="7.5" transform="rotate(22)"/>
  <circle r="4.2" fill="#F8B400" stroke="none"/>
  <circle cx="17.8" cy="-6.5" r="2.2" fill="#EDEAE0" stroke="none" opacity=".9"/>
</g>

<!-- ============ track ============ -->
<g fill="none" stroke="#4C463A" stroke-width="2.25" stroke-linecap="round">
  <path d="M110 268 H 218" marker-end="url(#wdAg)"/>
  <path d="M306 268 C 386 268, 400 214, 494 214" marker-end="url(#wdAg)"/>
  <path d="M306 268 H 494" marker-end="url(#wdAg)"/>
  <path d="M306 268 C 386 268, 400 322, 494 322" marker-end="url(#wdAg)"/>
  <path d="M630 214 C 668 214, 660 268, 684 268"/>
  <path d="M630 268 H 684"/>
  <path d="M630 322 C 668 322, 660 268, 684 268"/>
  <path d="M656 268 H 686" marker-end="url(#wdAg)"/>
  <path d="M726 268 H 812" marker-end="url(#wdAg)"/>
  <path d="M842 268 H 900" marker-end="url(#wdAg)"/>
</g>
<!-- passage through the gate, pending -->
<path d="M694 268 H 718" fill="none" stroke="#7C7264" stroke-width="2.25" stroke-dasharray="2 4" stroke-linecap="round"/>

<!-- planner: an excursion the orchestrator takes where warranted, and dispatches from -->
<g fill="none" stroke="#8E6E22" stroke-width="1.9" stroke-dasharray="5 5" stroke-linecap="round">
  <path d="M266 236 C 280 196, 324 168, 376 170" marker-end="url(#wdAg)"/>
  <path d="M412 190 C 376 214, 328 226, 292 246" marker-end="url(#wdAg)"/>
</g>

<!-- rebound: the gate sends it back to the worker that wrote it -->
<g fill="none" stroke="#6E6A62" stroke-width="1.7" stroke-dasharray="4 5" stroke-linecap="round">
  <path d="M706 236 C 706 180, 676 166, 636 166 C 604 166, 592 178, 590 195" marker-end="url(#wdAd)"/>
</g>
<text x="656" y="154" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#7C776E">changes requested</text>

<!-- ============ bodies ============ -->

<!-- human: sets the vision -->
<g transform="translate(92 268)">
  <path d="M0 -14 L14 0 L0 14 L-14 0 Z" fill="#EDEAE0"/>
  <path d="M0 -22 L22 0 L0 22 L-22 0 Z" fill="none" stroke="#EDEAE0" stroke-opacity=".28"/>
</g>

<!-- orchestrator: the mechanism holding phase -->
<g transform="translate(258 268)">
  <circle r="46" fill="url(#wdHubGlow)"/>
  <ellipse rx="45" ry="17.5" transform="rotate(-20)" fill="none" stroke="#F8B400" stroke-opacity=".34" stroke-width="1.2"/>
  <ellipse rx="45" ry="17.5" transform="rotate(24)" fill="none" stroke="#F8B400" stroke-opacity=".22" stroke-width="1.2"/>
  <circle r="30" fill="none" stroke="#F8B400" stroke-opacity=".85" stroke-width="2"/>
  <circle r="10.5" fill="#F8B400"/>
  <g transform="rotate(-20)"><circle cx="45" cy="0" r="3.2" fill="#EDEAE0"/></g>
  <g transform="rotate(24)"><circle cx="-45" cy="0" r="3.2" fill="#F8B400" opacity=".8"/></g>
</g>

<!-- planner -->
<g transform="translate(396 176)">
  <circle r="13" fill="#0C0D10" stroke="#D9A62E" stroke-width="2"/>
  <circle r="4" fill="#D9A62E"/>
</g>

<!-- workers: one body per isolated worktree -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Courier New,monospace" font-size="10.5" fill="#9A9488">
  <g transform="translate(0 214)">
    <rect x="502" y="-15" width="124" height="30" rx="15" fill="#101115" stroke="#F8B400" stroke-opacity=".26"/>
    <circle cx="522" r="8" fill="#F8B400"/><text x="540" y="3.6">agent/w-1</text>
  </g>
  <g transform="translate(0 268)">
    <rect x="502" y="-15" width="124" height="30" rx="15" fill="#101115" stroke="#F8B400" stroke-opacity=".26"/>
    <circle cx="522" r="8" fill="#F8B400"/><text x="540" y="3.6">agent/w-2</text>
  </g>
  <g transform="translate(0 322)">
    <rect x="502" y="-15" width="124" height="30" rx="15" fill="#101115" stroke="#F8B400" stroke-opacity=".26"/>
    <circle cx="522" r="8" fill="#F8B400"/><text x="540" y="3.6">agent/w-3</text>
  </g>
</g>

<!-- the gate: adversarial review, then CI -->
<rect x="684" y="231" width="44" height="74" rx="8" fill="#EDEAE0" fill-opacity=".045"/>
<g transform="translate(706 268)">
  <rect x="-16" y="-31" width="4.5" height="62" rx="2.25" fill="#C9C4B8"/>
  <rect x="11.5" y="-31" width="4.5" height="62" rx="2.25" fill="#C9C4B8"/>
</g>

<!-- verdict gate: the human turns the key, closing the loop it opened -->
<g transform="translate(830 268)">
  <rect x="-2.4" y="-31" width="4.8" height="62" rx="2.4" fill="#F8B400"/>
  <path d="M0 -55 L11 -44 L0 -33 L-11 -44 Z" fill="#EDEAE0"/>
</g>

<!-- main -->
<g transform="translate(918 268)">
  <circle r="30" fill="url(#wdMainGlow)"/>
  <circle r="12.5" fill="#F8B400"/>
  <circle r="19" fill="none" stroke="#F8B400" stroke-opacity=".45"/>
</g>

<!-- ============ labels ============ -->
<g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">
  <g font-size="9.5" font-weight="600" letter-spacing="1.7" fill="#8E7A3E">
    <text x="92" y="362">INTENT</text>
    <text x="258" y="362">GROOM</text>
    <text x="564" y="362">BUILD</text>
    <text x="706" y="362">GATE</text>
    <text x="830" y="362">LAND</text>
  </g>
  <g font-size="14.5" font-weight="600" fill="#EDEAE0">
    <text x="92" y="384">Human</text>
    <text x="258" y="384">Orchestrator</text>
    <text x="564" y="384">Workers</text>
    <text x="706" y="384">Review + CI</text>
    <text x="830" y="384">Verdict merge</text>
  </g>
  <g font-size="11.5" fill="#847F76">
    <text x="92" y="402">sets the vision</text>
    <text x="258" y="402">issues &#183; board tasks</text>
    <text x="564" y="402">isolated worktrees</text>
    <text x="706" y="402">adversarial review &#183; CI</text>
    <text x="830" y="402">human&#8209;gated</text>
  </g>
  <g>
    <text x="396" y="116" font-size="9.5" font-weight="600" letter-spacing="1.7" fill="#8E7A3E">PLAN</text>
    <text x="396" y="138" font-size="14.5" font-weight="600" fill="#EDEAE0">Planner</text>
    <text x="396" y="156" font-size="11.5" fill="#847F76">where warranted</text>
  </g>
</g>
<g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" text-anchor="end">
  <text x="944" y="204" font-size="9.5" font-weight="600" letter-spacing="1.7" fill="#8E7A3E">SHIP</text>
  <text x="944" y="226" font-size="14.5" font-weight="600" fill="#EDEAE0">main &#183; release</text>
</g>
</svg>
