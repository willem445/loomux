# orrerix's own agent workflow (#222) — the repo dogfoods its own feature.
#
# Turn the **advanced orchestrator** on in the launcher and this file *is* the
# roster. With the toggle off, this file is not even opened. ROSTER changes
# apply only on a fresh launch (or a live advanced-orchestrator toggle flip);
# the MERGE GATE below is re-derived live for running advanced groups (#385),
# so editing `gates:` takes effect immediately — the unsafe direction to get
# wrong, which is why it is said here.
#
# Shape (2026-08, distilled from two autonomous hardening batches):
# one JUDGING reviewer lane instead of three (a fixed three-lane fan-out of
# full reviewers proved token-heavy; one strong adversarial reviewer caught
# every defect class the lanes did), fronted by three CHEAP mechanical
# quick-review lanes on a small model that settle the checkable claims
# before the lead lane spends attention on them (#1388), two worker tiers
# routed by task difficulty, a planner for design-first features, a
# post-merge process-pro, and the #581 merge queue armed for integration
# branches.
#
# Each block's persona is a file in `.github/agents/`, which is Copilot's own
# custom-agent convention — a `cli: copilot` block loads it natively and a
# `cli: claude` block gets the same text via `--agents`. The `model:` on a
# block is the ONE source of truth for what that block runs.

version: 1
name: loomux

# OPT-IN (#581): the bisecting merge queue for orchestrator-owned INTEGRATION
# branches — structurally incapable of touching the default branch, which
# keeps its own human gate regardless. Approved sub-PRs are batched onto a
# scratch ref, verified by this repo's own CI once, fast-forwarded on green
# (the tested SHA is the landed SHA), bisected on red. max_batch 3 = a red
# batch costs at most 2 extra runs; a green one costs +1 total.
merge_queue:
  enabled: true
  max_batch: 3
  checks_timeout_minutes: 60

blocks:
  # The orchestrator is orrerix's trust root: a repo file may pin its cli/model
  # and nothing else (no prompt:, no profile:, no allow:) — a parse error, on
  # purpose. See doc/design/workflows.md.
  - id: orchestrator
    name: Orchestrator
    kind: orchestrator
    cli: claude
    model: fable

  # Design-first features get a plan before code (a planner's issue-comment
  # plan is the cheapest gate a wrong split can hit).
  - id: planner
    name: Planner
    kind: planner
    cli: claude
    model: fable

  # ── two worker tiers, routed by difficulty ────────────────────────────────
  # Deep (opus) for judgment-heavy work: security surfaces, delivery/queue
  # machinery, anything whose wrong answer is expensive to unwind. Quick
  # (sonnet) for contained work: focused fixes, docs, test additions,
  # mechanical refactors. Deep is the default for a bare
  # `spawn_agent(kind: "worker")` — a wrong-tier deep worker costs tokens,
  # a wrong-tier quick worker costs a bad diff.

  - id: worker-deep
    name: Deep worker
    kind: worker
    cli: claude
    model: opus
    profile: .github/agents/worker-deep.md

  - id: worker-quick
    name: Quick worker
    kind: worker
    cli: claude
    model: sonnet
    profile: .github/agents/worker-quick.md

  # ── the lead reviewer: the one lane that JUDGES ───────────────────────────
  # A single strong adversarial reviewer replaces the previous three
  # lane-scoped ones: the fixed three-lane fan-out cost three panes per PR
  # (two of which usually abstained "outside my lane") and re-staled three
  # verdicts on every rebase. rev-lead.md carries all three lanes' checklists
  # plus the review discipline the batches proved out — verify claims against
  # runs, real red evidence, mutation rounds for coverage claims, purity via
  # normalized range-diff, the body as the squash record.

  - id: rev-lead
    name: Lead review
    kind: reviewer
    cli: claude
    model: opus
    profile: .github/agents/rev-lead.md

  # ── three cheap quick-review lanes, ahead of the lead lane (#1388) ────────
  # Each runs a FIXED numbered checklist of shell commands and reports what
  # they printed: qr-evidence on the body's own evidence (red-before-green,
  # run ids that name the head SHA, the diffstat, file:line cites), qr-tests
  # on the tests (added at all, mutation receipts, count delta, named tests
  # exist), qr-constraints on CLAUDE.md's hard constraints as greps with
  # positive controls. They are instruments, not reviewers: each line is PASS
  # (artifact present), FAIL (artifact ABSENT and quotable) or ESCALATE (could
  # not decide), and anything off the checklist is SILENT — design, naming and
  # style are rev-lead's, and only rev-lead's.
  #
  # `opencode` + a free Zen model is the point: the work these lanes do is
  # running greps and comparing strings, which does not need opus, and a lane
  # that can only fail on a quotable absence cannot spend a strong model's
  # judgment badly. Model ids on this CLI are `provider_id/model_id` and
  # `default_model("opencode", …)` is deliberately EMPTY, so the id is pinned
  # in full here — the bare half is not a model that exists.
  #
  # ORDER IS LOAD-BEARING: rev-lead is declared FIRST among reviewer blocks
  # because `block_for(Role::Reviewer)` resolves a bare
  # `spawn_agent(kind: "reviewer")` to the first reviewing block in roster
  # order. A qr-* lane sitting first would answer an unrouted review request
  # with a checklist instead of a review. Same argument as worker-deep's.

  - id: qr-evidence
    name: Quick review — evidence
    kind: reviewer
    cli: opencode
    model: opencode/deepseek-v4-flash-free
    profile: .github/agents/qr-evidence.md

  - id: qr-tests
    name: Quick review — tests
    kind: reviewer
    cli: opencode
    model: opencode/deepseek-v4-flash-free
    profile: .github/agents/qr-tests.md

  - id: qr-constraints
    name: Quick review — constraints
    kind: reviewer
    cli: opencode
    model: opencode/deepseek-v4-flash-free
    profile: .github/agents/qr-constraints.md

  # ── process-pro: spawned after a merge, not on the per-PR path ────────────
  # `role_hint` is not cosmetic: a hint can change which MCP tools its block is
  # offered, from a list orrerix enumerates (doc/design/liaison.md). process
  # is worker-kind: it mines the merged session via `session_digest`, opens a
  # normal PR proposing a lessons/skill update, and stops there; it never
  # merges anything, including its own PR.
  #
  # Its PRs are ORCHESTRATOR-OWNED (#1021): the learning loop is self-managed,
  # so the orchestrator reviews and then merges or closes them itself rather
  # than adding them to the human's merge queue. Same bar as any merge —
  # rev-lead's pass, green CI, findings dispositioned — only the disposition
  # owner differs.

  - id: process
    name: Process-pro
    kind: worker
    cli: claude
    model: opus
    profile: .github/agents/process.md
    role_hint: process

# ADVISORY — the declared happy path, not a schedule. orrerix does not walk
# these; the orchestrator still decides what to serialize, what to
# parallelize, and when to plan first. The rework loop (findings → owning
# worker → re-review of the new head) is the orchestrator's loop to run.
edges:
  - { from: orchestrator, to: [planner, worker-deep, worker-quick, process] }
  - { from: planner, to: [worker-deep, worker-quick] }
  - { from: worker-deep, to: [qr-evidence, qr-tests, qr-constraints] }
  - { from: worker-quick, to: [qr-evidence, qr-tests, qr-constraints] }
  # The quick lanes run FIRST and chain into the lead lane: their whole value
  # is that rev-lead reads their PASS results instead of re-deriving them.
  - { from: qr-evidence, to: [rev-lead] }
  - { from: qr-tests, to: [rev-lead] }
  - { from: qr-constraints, to: [rev-lead] }

# ENFORCED — the gh shim refuses `gh pr merge` until this is satisfied,
# whatever an agent believes about its own approval.
#
# ALL-PASS over four lanes, and what makes that safe is the NARROWNESS of what
# the three cheap ones are allowed to say — not a claim that they cannot block.
# Both `fail` and `escalate` refuse a merge (workflow.rs `Verdict::is_blocking`),
# a qr-* lane can absolutely stop one. The argument is about what may TRIGGER
# either: a lane may `fail` a check ONLY on the absence of a named artifact it
# can quote, may `escalate` a check ONLY when it could not decide that check,
# and is SILENT on everything off its checklist. It is never asked for a
# judgment, so it can never block on one — every refusal it can produce comes
# with the command and the output that produced it, which is a thing a human or
# rev-lead can settle in one look.
#
# The residual, stated rather than argued away: a small model can PASS a lane it
# should have failed. That costs a missed mechanical check, and rev-lead is
# still in this gate and still reviews the whole PR — so the failure mode is a
# check that silently did not happen, never a wrong merge these lanes waved
# through on their own. Read a qr-* pass as "the grep printed what it should",
# never as "this PR is fine".
#
# `threshold:` would be the unsafe spelling here — an abstention is a pass, so
# N-of-4 could open on the three cheap lanes while the one lane that judges is
# still reading.
# `ci-green` requires the PR's own checks green at merge.
# `body-unchanged` (#565/#634) pins the PR body — the squash commit message —
# to what the reviewer approved: a body edited after the pass refuses the
# merge until the reviewer re-records. Batches saw repeated post-approval
# body corrections; this makes the record's integrity mechanical.
gates:
  merge:
    require: all-pass
    reviewers: [rev-lead, qr-evidence, qr-tests, qr-constraints]
    also: [ci-green, body-unchanged]
