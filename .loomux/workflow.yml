# loomux's own agent workflow (#222) — the repo dogfoods its own feature.
#
# Turn the **advanced orchestrator** on in the launcher and this file *is* the
# roster. With the toggle off, this file is not even opened. A change here does
# NOT apply to an already-running group — only a fresh launch (or a live
# advanced-orchestrator toggle flip) reads it.
#
# Shape (2026-08, distilled from two autonomous hardening batches):
# one reviewer lane instead of three (a fixed three-lane fan-out proved
# token-heavy; one strong adversarial reviewer caught every defect class the
# lanes did), two worker tiers routed by task difficulty, a planner for
# design-first features, a post-merge process-pro, and the #581 merge queue
# armed for integration branches.
#
# Each block's persona is a file in `.github/agents/`, which is Copilot's own
# custom-agent convention — a `cli: copilot` block loads it natively and a
# `cli: claude` block gets the same text via `--agents`. The `model:` on a
# block is the ONE source of truth for what that block runs.

version: 1
name: loomux

blocks:
  # The orchestrator is loomux's trust root: a repo file may pin its cli/model
  # and nothing else (no prompt:, no profile:, no allow:) — a parse error, on
  # purpose. See doc/design/workflows.md.
  - id: orchestrator
    name: Orchestrator
    kind: orchestrator
    cli: claude
    model: fable

  # Design-first features get a plan before code (a planner's issue-comment
  # plan is the cheapest gate a wrong split can hit).
  - id: planner
    name: Planner
    kind: planner
    cli: claude
    model: opus

  # ── two worker tiers, routed by difficulty ────────────────────────────────
  # Deep (opus) for judgment-heavy work: security surfaces, delivery/queue
  # machinery, anything whose wrong answer is expensive to unwind. Quick
  # (sonnet) for contained work: focused fixes, docs, test additions,
  # mechanical refactors. Deep is the default for a bare
  # `spawn_agent(kind: "worker")` — a wrong-tier deep worker costs tokens,
  # a wrong-tier quick worker costs a bad diff.

  - id: worker-deep
    name: Deep worker
    kind: worker
    cli: claude
    model: opus
    profile: .github/agents/worker-deep.md

  - id: worker-quick
    name: Quick worker
    kind: worker
    cli: claude
    model: sonnet
    profile: .github/agents/worker-quick.md

  # ── one reviewer lane ─────────────────────────────────────────────────────
  # A single strong adversarial reviewer replaces the previous three
  # lane-scoped ones: the fixed three-lane fan-out cost three panes per PR
  # (two of which usually abstained "outside my lane") and re-staled three
  # verdicts on every rebase. rev-lead.md carries all three lanes' checklists
  # plus the review discipline the batches proved out — verify claims against
  # runs, real red evidence, mutation rounds for coverage claims, purity via
  # normalized range-diff, the body as the squash record.

  - id: rev-lead
    name: Lead review
    kind: reviewer
    cli: claude
    model: opus
    profile: .github/agents/rev-lead.md

  # ── process-pro: spawned after a merge, not on the per-PR path ────────────
  # `role_hint` is cosmetic — capability keys exclusively off `kind`. process
  # is worker-kind: it mines the merged session via `session_digest`, opens a
  # normal PR proposing a lessons/skill update, and stops there — the same
  # merge gate as any worker; it never merges anything, including its own PR.

  - id: process
    name: Process-pro
    kind: worker
    cli: claude
    model: sonnet
    profile: .github/agents/process.md
    role_hint: process

# ADVISORY — the declared happy path, not a schedule. loomux does not walk
# these; the orchestrator still decides what to serialize, what to
# parallelize, and when to plan first. The rework loop (findings → owning
# worker → re-review of the new head) is the orchestrator's loop to run.
edges:
  - { from: orchestrator, to: [planner, worker-deep, worker-quick, process] }
  - { from: planner, to: [worker-deep, worker-quick] }
  - { from: worker-deep, to: [rev-lead] }
  - { from: worker-quick, to: [rev-lead] }

# ENFORCED — the gh shim refuses `gh pr merge` until this is satisfied,
# whatever an agent believes about its own approval.
#
# Single lane, so all-pass and threshold are equivalent; all-pass is the
# honest spelling. `ci-green` requires the PR's own checks green at merge.
# `body-unchanged` (#565/#634) pins the PR body — the squash commit message —
# to what the reviewer approved: a body edited after the pass refuses the
# merge until the reviewer re-records. Batches saw repeated post-approval
# body corrections; this makes the record's integrity mechanical.
gates:
  merge:
    require: all-pass
    reviewers: [rev-lead]
    also: [ci-green, body-unchanged]

# OPT-IN (#581): the bisecting merge queue for orchestrator-owned INTEGRATION
# branches — structurally incapable of touching the default branch, which
# keeps its own human gate regardless. Approved sub-PRs are batched onto a
# scratch ref, verified by this repo's own CI once, fast-forwarded on green
# (the tested SHA is the landed SHA), bisected on red. max_batch 3 = a red
# batch costs at most 2 extra runs; a green one costs +1 total.
merge_queue:
  enabled: true
  max_batch: 3
  checks_timeout_minutes: 60
