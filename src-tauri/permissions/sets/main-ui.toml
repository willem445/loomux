[[set]]
identifier = "main-ui"
description = "Aggregates every module permission set (#363) — everything the trusted main webview needs, across every app command. (No total is restated here: tests/acl_manifest.rs's app_commands_len_is_<N> is where the count lives, name and all. This line said 120 while the manifest held 147.) main is the only trusted webview, so it gets the full aggregate; a future plugin/non-main webview gets zero (see capabilities/plugin-zero-template.json) or a curated subset of the module sets below, never this aggregate."
permissions = [
    "pty-read",
    "pty-control",
    "git-read",
    "git-write",
    "gh-read",
    "gh-write",
    "gitwatch",
    "orch-read",
    "orch-control",
    "fileedit-read",
    "fileedit-write",
    "filemgr-read",
    "filemgr-write",
    "misc",
]
