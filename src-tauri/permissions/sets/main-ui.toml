[[set]]
identifier = "main-ui"
description = "Aggregates every module permission set (#363, extended by #360 Slices B, C and D and by #377) — everything the trusted main webview needs across all 140 app commands (132 on main before this feature, +2 for Slice B's plugins set, +3 for Slice C's pluginbroker set, +2 for Slice D's plugin_close_window/plugin_set_frame, which the misc set carries into this aggregate, +1 for #377's plugin_approve_capabilities, which the plugins set carries). main is the only trusted webview, so it gets the full aggregate; a plugin/non-main webview gets zero (see capabilities/plugin-zero-template.json) or the curated plugin-broker set (see capabilities/plugin.json), never this aggregate."
permissions = [
    "pty-read",
    "pty-control",
    "git-read",
    "git-write",
    "gh-read",
    "gh-write",
    "gitwatch",
    "orch-read",
    "orch-control",
    "fileedit-read",
    "fileedit-write",
    "filemgr-read",
    "filemgr-write",
    "misc",
    "plugins",
    "plugin-broker",
]
