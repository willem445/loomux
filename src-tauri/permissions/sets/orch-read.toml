[[set]]
identifier = "orch-read"
description = "Read-only orchestration queries: tasks, audit log, merge queue, session roles, autonomy/usage/summary, workflow preview/status, channel list, notification/spawn state, per-CLI model knobs."
permissions = [
    "allow-agent-autopilot-flags",
    "allow-agent-cli-knobs",
    "allow-orch-tasks",
    "allow-orch-audit",
    "allow-orch-merge-queue",
    "allow-orch-session-roles",
    "allow-orch-group-paused",
    "allow-orch-notify-enabled",
    "allow-orch-spawn-expanded",
    "allow-orch-autonomy",
    "allow-orch-group-usage",
    "allow-orch-group-summary",
    "allow-orch-workflow-preview",
    "allow-orch-workflow-status",
    "allow-orch-group-watches",
    "allow-orch-lock-state",
    "allow-orch-channel-list",
    "allow-orch-channel-for-pane",
]
