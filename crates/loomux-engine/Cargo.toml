# The orchestration engine, as a crate that does not link Tauri (#888 slice A1
# / #847 Phase 0). It landed empty and is filling up in batches, each module
# re-exported from `src-tauri/src/orchestration/mod.rs` under its original path
# so no call site moved with it. `src/lib.rs` is the running account of what is
# here and why it arrived in that order; doc/design/engine-extraction.md is the
# boundary argument and the order of what is still to come.
[package]
name = "loomux-engine"
# NOT the loomux release version, and deliberately not part of the seven
# version fields `scripts/check-versions.js` keeps in lockstep. This crate is
# `publish = false`: it is an internal boundary, not a shipped artifact, so a
# version on it would be a number nobody reads and one more thing a release
# bump could forget. If it is ever published, it joins that check in the same
# commit that flips this flag.
version = "0.0.0"
edition = "2021"
publish = false
description = "loomux orchestration engine — the Tauri-free core (internal; not published)"

# DEPENDENCIES — this section is here to be read rather than skipped, and it
# states no count on purpose: the crate's defining property is what it must
# NEVER depend on, and a number here would be one more thing the next batch has
# to remember to update.
#
#   - `tauri` (and any tauri-* crate). The entire point is a core a headless
#     Linux daemon can link without webkit2gtk. `src-tauri` depends on THIS
#     crate; the arrow never points back. Plan-463 slice A4 adds the CI step
#     that proves it from `cargo tree` once there is a real dependency graph
#     to inspect; until then the manifest-level half is pinned by
#     test/workspacelayout.test.ts.
#   - getrandom-based crates. CLAUDE.md constraint 2 is about the shipped
#     Windows binary's load-time imports, and this crate is linked INTO that
#     binary — so the ban applies here exactly as it does in
#     src-tauri/Cargo.toml, whose audit notes are the reference. A dependency
#     that is fine for a Linux daemon is not automatically fine here.
[dependencies]
# `groupid` (slice A2 batch 2) is not std-only: `GroupId` hand-writes both
# halves of its wire form, and the `Deserialize` half is load-bearing security
# rather than convenience — it routes a persisted or hand-edited id back through
# `GroupId::parse` instead of trusting the file.
#
# Clear under both bans above. `serde` is already in the shipped binary's linked
# graph (src-tauri depends on it directly), so this adds no NEW crate to the
# graph the getrandom audit reasons about — `serde` itself is `no_std`-capable,
# pulls in `serde_derive` only via its `derive` feature, and reaches `getrandom`
# by no path.
#
# `derive` is asked for explicitly as of slice A2 batch 3, and the reason it was
# NOT asked for before is worth keeping rather than deleting: `groupid` writes
# both impls by hand, so the feature would have been unused surface. `notify`
# derives `Deserialize` for the `gh --json` row it parses, so the feature is now
# genuinely used — and declaring it is not a formality. Resolver-2 unifies
# features across the packages in one build, so `src-tauri`'s `derive` already
# reaches the single compiled `serde` whenever both are built together; an
# undeclared need would therefore compile under `--workspace` and fail only for
# someone building this crate alone. A manifest states what the crate needs, not
# what a sibling happens to switch on for it.
serde = { version = "1", features = ["derive"] }
# `notify` (slice A2 batch 3) classifies `gh pr checks` / `gh run view` payloads
# from their `--json` output, which is a `serde_json::Value` walk plus one
# derived row struct.
#
# Clear under both bans, on the same ground as `serde`: already in the shipped
# binary's linked graph via src-tauri, so no NEW crate joins the graph the
# getrandom audit reasons about, and its own dependencies (`itoa`, `memchr`,
# `ryu`, `serde`) reach `getrandom` by no path.
serde_json = "1"
# `workflow` (slice A2 batch 5) parses `<repo>/.loomux/workflow.yml`. The parser
# is the whole reason that module exists, so YAML travels with it.
#
# Clear under both bans, and on stronger ground than "no getrandom in its tree"
# alone: `serde_norway` and its `unsafe-libyaml-norway` backend are ALREADY in
# the shipped binary's linked graph via src-tauri, whose manifest carries the
# full audit (run 2026-07-11, with the reproduction commands and the reasoning
# for choosing the maintained fork over the archived `serde_yaml`). No new
# package joins the lock and no fourth getrandom edge appears — this is the same
# package, now also named by the crate that actually calls it.
#
# The attack-surface note over there applies here unchanged and is worth
# repeating at the boundary it now crosses: this parses a file that comes from
# the repo, so the parser's *output* is treated as untrusted (capability
# closure, id/persona sanitization) rather than merely its input.
serde_norway = "0.9.42"
# `workflow::body_digest` — the sha256 a `review_verdict` records so the merge
# gate can tell "this PR was approved" from "some earlier version of it was".
# The digest and the gate-file format are one definition, so it moves with them.
#
# Clear under both bans, on the same ground as the YAML: `sha2` is already in
# the shipped binary's graph (src-tauri's manifest carries that audit too, and
# notes `sha2` was in `Cargo.lock` as a tauri transitive even before loomux
# asked for it). Its chain is `cfg-if`, `cpufeatures` → `libc`, `digest` — no
# getrandom by any path.
sha2 = "0.10"
# `obs::data_root` (slice A3 batch 7) resolves the platform user-data directory
# — `<user data dir>/loomux`, the root every persisted singleton (`logs/`,
# `orchestration/`, `tabs.json`) hangs off. `dirs::data_dir()` is the whole use.
#
# Clear under both bans, on the same "already in the shipped binary's linked
# graph" ground as the four above (src-tauri depends on `dirs` directly), but
# this one needs a sentence more than they did, because it is the ONLY
# dependency this crate has taken that appears in a getrandom query at all.
# src-tauri/Cargo.toml's audit enumerates it: `cargo tree -e normal --target all
# -i getrandom@0.2.17` prints `getrandom → redox_users → dirs-sys → dirs →
# {loomux, tauri, wry}`. That edge is REDOX-ONLY — `dirs` gates `redox_users`
# behind `cfg(target_os = "redox")` — so it is not compiled on Windows, macOS or
# Linux, and the ban is about the shipped Windows binary's load-time imports.
# The edge is also pre-existing: naming `dirs` here adds no package to the lock
# and no fourth getrandom edge; it records that the crate which now *calls* it
# also declares it, per batch 3's rule.
dirs = "6"

# `winpath::fresh_path` (slice A4 batch 13) reads the machine + user PATH
# registry values so a CLI installed while loomux is already running is still
# found by new panes and probes. Target-gated to mirror `src-tauri/Cargo.toml`'s
# identical `[target.'cfg(windows)'.dependencies]` section — same version,
# same reasoning, restated here because a manifest states what the crate that
# now calls it needs, not what a sibling happens to declare (batch 3's rule).
#
# Clear under both bans in the header above: already a direct src-tauri
# dependency and already in `Cargo.lock`, so this adds no NEW package to the
# graph the getrandom audit reasons about, and `winreg` 0.55's own dependency
# chain is `cfg-if` + `windows-sys` — no getrandom by any path.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The crate's first dev-dependency, and the boundary it sits on is worth stating
# once: dev-dependencies are never built for a downstream crate, so nothing here
# can reach the shipped binary — the ban above is about load-time imports of
# orrerix.exe, and this graph is not in it. `default-features = false` anyway,
# mirroring src-tauri's identical entry: tempfile's defaults switch on
# `getrandom` for its random file names, and belt-and-braces is cheap when the
# alternative is a future reader having to re-derive why the exemption applies.
[dev-dependencies]
# `obs`'s inline tests write crash logs, breadcrumbs and the running.lock
# sentinel into a temp tree rather than the real user data dir.
tempfile = { version = "3", default-features = false }
