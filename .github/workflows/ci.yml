name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fast mechanical backstop for release bumps (#274): the seven version
      # fields across six files (package.json, package-lock.json x2,
      # npm/package.json, tauri.conf.json, Cargo.toml, Cargo.lock) must all
      # agree. v0.8.0 shipped with a stale package-lock.json (#224) because
      # that check was checklist-only — fail the build on drift instead.
      - name: Check version consistency
        run: node scripts/check-versions.js

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (typecheck + bundle)
        run: npm run build

      # `npm run build` above is a typecheck, not a test run — the frontend suite
      # (node:test over `test/**/*.test.ts`) was never gated by CI at all, so a
      # regression in a pure module merged green as long as it still typechecked.
      # That includes the pin on the repo's OWN `.loomux/workflow.yml` (#222), which
      # is only worth having if it runs on every PR.
      - name: Test frontend
        run: npm test

      - name: Check backend
        run: cargo check --locked
        working-directory: src-tauri

      - name: Test backend
        run: cargo test --locked
        working-directory: src-tauri

  # E2E PoC (spike, doc/design/e2e-testing.md): drives the real WebView2
  # webview over CDP (Playwright's native WebView2 support). Windows-only —
  # that's the only platform CDP-over-WebView2 covers, and it's this project's
  # Windows-10 baseline anyway. Runs against an isolated profile
  # (`tauri.e2e.conf.json`'s `dev.loomux.e2e` identifier + `LOOMUX_DATA_DIR`),
  # never a real install (issue #394 overlap — see e2e/fixtures.ts).
  # continue-on-error while flakiness is unknown: this must never red the
  # merge gate on its own — drop it once the suite has a track record.
  e2e-windows:
    name: E2E (Playwright, experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (E2E identifier, unbundled debug build)
        run: npx tauri build --debug --no-bundle --config src-tauri/tauri.e2e.conf.json

      # Temporary ground-truth probe (see doc/design/e2e-testing.md CI notes):
      # Playwright's connect timeout can't tell "process never started" from
      # "process running but WebView2 never opens the port" apart, and the
      # previous run's captured stdout/stderr were both silent either way.
      # This runs the exe directly and inspects OS-level state instead.
      - name: Diagnose WebView2 launch
        shell: pwsh
        run: |
          Write-Host "--- process integrity level ---"
          whoami /groups | Select-String "Label"

          Write-Host "--- attempt 1: direct launch (elevated context, if any) ---"
          $env:LOOMUX_DATA_DIR = "$env:RUNNER_TEMP\loomux-diag"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9999 --disable-gpu"
          $p = Start-Process -FilePath "src-tauri\target\debug\loomux.exe" -PassThru
          Start-Sleep -Seconds 15
          Get-Process -Id $p.Id -ErrorAction SilentlyContinue | Format-List Id,ProcessName,Responding,HasExited
          netstat -ano | Select-String ":9999"
          try {
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:9999/json/version" -UseBasicParsing -TimeoutSec 5
            Write-Host "SUCCESS (direct): $($resp.Content)"
          } catch {
            Write-Host "probe failed (direct): $_"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          # WebView2 Runtime 150+ has a known regression (MicrosoftEdge/WebView2Feedback#5640):
          # the DevTools/CDP endpoint never opens when the host app runs at High
          # integrity level. GitHub-hosted windows-latest runs jobs as an admin
          # account, which is plausibly why attempt 1 above fails while the same
          # code works on a normal (Medium IL) dev machine. `runas /trustlevel:0x20000`
          # re-launches at Medium IL without a credential prompt (de-elevating, not
          # elevating, needs no consent) -- testing whether that's the actual fix.
          Write-Host "--- attempt 2: de-elevated launch via runas /trustlevel:0x20000 (Medium IL) ---"
          $launcher = "$env:RUNNER_TEMP\launch.bat"
          $exePath = (Resolve-Path "src-tauri\target\debug\loomux.exe").Path
          $dataDir2 = "$env:RUNNER_TEMP\loomux-diag2"
          @"
          @echo off
          set LOOMUX_DATA_DIR=$dataDir2
          set WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9998 --disable-gpu
          start "" "$exePath"
          "@ | Set-Content -Path $launcher -Encoding ASCII
          runas /trustlevel:0x20000 "cmd /c `"$launcher`""
          Start-Sleep -Seconds 15
          netstat -ano | Select-String ":9998"
          try {
            $resp2 = Invoke-WebRequest -Uri "http://127.0.0.1:9998/json/version" -UseBasicParsing -TimeoutSec 5
            Write-Host "SUCCESS (de-elevated): $($resp2.Content)"
          } catch {
            Write-Host "probe failed (de-elevated): $_"
          }
          Get-Process loomux -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        continue-on-error: true

      - name: Run Playwright E2E suite
        run: npx playwright test
        env:
          LOOMUX_E2E_EXE: ${{ github.workspace }}\src-tauri\target\debug\loomux.exe

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
